<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MilTech.ru — крупнейший каталог демилитаризованной, музейной военной техники и запчастей с точными ТТХ.">
    <title>MilTech.ru — Каталог военной техники</title>
    
    <!-- CDN Зависимости -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Локальные файлы -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-[#2d3f52]" style="background: rgba(15, 20, 25, 0.95); backdrop-filter: blur(12px);">
        <div class="max-w-[1920px] mx-auto px-6 py-4">
            <div class="flex items-center justify-between gap-8">
                <div class="flex items-center gap-3 cursor-pointer" onclick="resetAll()">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-lg shadow-amber-900/20">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-white tracking-tight">MilTech<span class="text-amber-500">.ru</span></h1>
                        <p class="text-[10px] uppercase tracking-widest text-gray-400">Каталог военной техники</p>
                    </div>
                </div>

                <nav class="hidden lg:flex items-center gap-8">
                    <a href="#" class="text-sm font-medium text-white border-b-2 border-amber-500 pb-1">Каталог</a>
                    <a href="#" class="text-sm font-medium text-gray-400 hover:text-white transition">Сравнение</a>
                    <a href="#" class="text-sm font-medium text-gray-400 hover:text-white transition">Карта</a>
                    <a href="#" class="text-sm font-medium text-gray-400 hover:text-white transition">Запчасти</a>
                </nav>

                <div class="flex items-center gap-3">
                    <button class="hidden md:flex items-center gap-2 px-4 py-2 rounded-lg border border-[#2d3f52] text-sm text-gray-300 hover:border-amber-500 hover:text-amber-500 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                        Избранное
                    </button>
                    <button class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold transition shadow-lg shadow-amber-900/20">
                        + Разместить
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative border-b border-[#2d3f52]">
        <div class="absolute inset-0 bg-gradient-to-b from-[#1a2332] to-[#0f1419]"></div>
        <div class="relative max-w-[1920px] mx-auto px-6 py-12">
            <div class="max-w-4xl mx-auto text-center">
                <h2 class="text-3xl md:text-4xl font-bold mb-3 text-white">Найди военную технику <span class="text-amber-500">по точным ТТХ</span></h2>
                <p class="text-gray-400 mb-8">От стрелкового оружия до авианосцев. Демилитаризованная, музейная, на запчасти.</p>

                <div class="relative max-w-3xl mx-auto">
                    <div class="flex items-center bg-[#1a2332] border border-[#2d3f52] rounded-xl overflow-hidden focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500/50 transition shadow-2xl">
                        <div class="pl-4"><svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>
                        <input type="text" id="mainSearch" placeholder="Поиск: Т-72, Су-27, БМП, катер, двигатель..." class="flex-1 px-4 py-4 bg-transparent text-white placeholder-gray-500 focus:outline-none text-lg">
                        <button class="px-8 py-4 bg-amber-600 hover:bg-amber-500 text-white font-semibold transition" onclick="applyFilters()">Найти</button>
                    </div>

                    <div class="flex flex-wrap gap-2 mt-5 justify-center">
                        <button class="filter-chip px-4 py-2 rounded-full border border-[#2d3f52] text-sm text-gray-300 bg-[#1a2332] active" data-filter="all" onclick="setCategory('all')">Все</button>
                        <button class="filter-chip px-4 py-2 rounded-full border border-[#2d3f52] text-sm text-gray-300 bg-[#1a2332]" data-filter="tank" onclick="setCategory('tank')">🛡️ Бронетехника</button>
                        <button class="filter-chip px-4 py-2 rounded-full border border-[#2d3f52] text-sm text-gray-300 bg-[#1a2332]" data-filter="aircraft" onclick="setCategory('aircraft')">✈️ Авиация</button>
                        <button class="filter-chip px-4 py-2 rounded-full border border-[#2d3f52] text-sm text-gray-300 bg-[#1a2332]" data-filter="naval" onclick="setCategory('naval')">🚢 Флот</button>
                        <button class="filter-chip px-4 py-2 rounded-full border border-[#2d3f52] text-sm text-gray-300 bg-[#1a2332]" data-filter="demilitarized" onclick="setCategory('demilitarized')">✓ Демилитаризованная</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="max-w-[1920px] mx-auto px-6 py-8 flex-1">
        <div class="flex gap-8">
            <!-- Sidebar Filters -->
            <aside class="hidden lg:block w-72 flex-shrink-0">
                <div class="sticky top-24 space-y-6">
                    <div class="bg-[#1a2332] rounded-xl p-5 border border-[#2d3f52]">
                        <h3 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                            <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                            Фильтры
                        </h3>
                        <div class="space-y-3">
                            <label class="flex items-center justify-between cursor-pointer group">
                                <span class="text-sm text-gray-300 group-hover:text-white transition">До 10 000 000 ₽</span>
                                <input type="checkbox" id="filterPrice" class="w-4 h-4 rounded border-[#2d3f52] text-amber-600 focus:ring-amber-500 bg-[#243447]" onchange="applyFilters()">
                            </label>
                            <label class="flex items-center justify-between cursor-pointer group">
                                <span class="text-sm text-gray-300 group-hover:text-white transition">С 3D моделью</span>
                                <input type="checkbox" id="filter3D" class="w-4 h-4 rounded border-[#2d3f52] text-amber-600 focus:ring-amber-500 bg-[#243447]" onchange="applyFilters()">
                            </label>
                            <label class="flex items-center justify-between cursor-pointer group">
                                <span class="text-sm text-gray-300 group-hover:text-white transition">Только с чертежами</span>
                                <input type="checkbox" id="filterBlueprint" class="w-4 h-4 rounded border-[#2d3f52] text-amber-600 focus:ring-amber-500 bg-[#243447]" onchange="applyFilters()">
                            </label>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Grid Area -->
            <main class="flex-1">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white">Каталог техники</h2>
                        <p class="text-sm text-gray-400 mt-1">Найдено: <span class="text-amber-500 font-mono font-bold" id="resultsCount">0</span> объявлений</p>
                    </div>
                    <select id="sortSelect" class="px-4 py-2 bg-[#1a2332] border border-[#2d3f52] rounded-lg text-sm text-gray-300 focus:outline-none focus:border-amber-500 cursor-pointer" onchange="applyFilters()">
                        <option value="newest">По дате (новые)</option>
                        <option value="price_asc">По цене (возрастание)</option>
                        <option value="price_desc">По цене (убывание)</option>
                        <option value="weight">По боевой массе</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="listingsGrid">
                    <!-- Cards injected via JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-overlay absolute inset-0 bg-black/80" onclick="closeModal()"></div>
        <div class="relative h-full overflow-y-auto scrollbar-thin">
            <div class="min-h-full flex items-start justify-center p-4 py-8">
                <div class="relative bg-[#1a2332] rounded-2xl max-w-5xl w-full border border-[#2d3f52] animate-slide-up shadow-2xl">
                    <button onclick="closeModal()" class="absolute top-4 right-4 z-20 w-10 h-10 rounded-full bg-black/50 hover:bg-amber-600 flex items-center justify-center text-white transition backdrop-blur-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                    <div id="modalContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Comparison Panel -->
    <div id="comparisonPanel" class="fixed bottom-0 left-0 right-0 bg-[#1a2332]/95 backdrop-blur-md border-t border-amber-500/30 p-4 hidden z-40 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <div class="max-w-[1920px] mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="text-sm font-semibold text-amber-500 uppercase tracking-wider">Сравнение:</span>
                <div id="comparisonItems" class="flex gap-3"></div>
            </div>
            <div class="flex gap-3">
                <button onclick="clearComparison()" class="px-4 py-2 rounded-lg border border-[#2d3f52] text-sm text-gray-300 hover:border-red-500 hover:text-red-500 transition">Очистить</button>
                <button onclick="showComparison()" class="px-6 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-sm font-bold transition shadow-lg shadow-amber-900/20">Сравнить ТТХ</button>
            </div>
        </div>
    </div>

    <!-- Локальные скрипты -->
    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
